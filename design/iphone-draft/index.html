<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Notchman iPhone draft</title>
<style>
@font-face { font-family: "Inter"; font-weight: 100 900; src: url("../../desktop/assets/fonts/InterVariable-latin.woff2") format("woff2"); }
:root {
  --ink: #111113; --ink-2: #5d5d66; --ink-3: #9a9aa3; --line: #e9e9e7; --surface: #fff; --surface-2: #f6f6f5; --page: #fbfbfa;
  --accent: #2563eb; --accent-soft: #eef3fe; --flame: #ea580c; --radius: 12px; --radius-lg: 16px;
  --shadow: 0 1px 2px rgba(17,17,19,.04), 0 1px 3px rgba(17,17,19,.03);
}
* { box-sizing: border-box; margin: 0; }
body { font-family: Inter, sans-serif; background: #e9e9e6; color: var(--ink); -webkit-font-smoothing: antialiased; padding: 48px; }
.board { display: flex; flex-wrap: wrap; gap: 48px; }
.screen-wrap { display: flex; flex-direction: column; gap: 14px; }
.screen-name { font-size: 15px; font-weight: 600; color: var(--ink-2); }
.phone { width: 402px; height: 874px; border-radius: 54px; background: var(--page); position: relative; overflow: hidden;
  box-shadow: 0 0 0 10px #111113, 0 30px 60px rgba(0,0,0,.18); display: flex; flex-direction: column; }
.status { height: 54px; flex: none; display: flex; align-items: center; justify-content: space-between; padding: 14px 36px 0 40px; font-weight: 600; font-size: 16px; }
.status .sys { display: flex; gap: 6px; align-items: center; }
.status .sys i { display: block; background: currentColor; border-radius: 3px; height: 11px; }
.island { position: absolute; top: 11px; left: 50%; transform: translateX(-50%); width: 124px; height: 36px; background: #000; border-radius: 20px; z-index: 5; }
.content { flex: 1; overflow: hidden; padding: 8px 20px 0; display: flex; flex-direction: column; gap: 16px; }
.tabbar { flex: none; height: 84px; background: rgba(255,255,255,.92); border-top: 1px solid var(--line); display: flex; justify-content: space-around; padding: 10px 28px 0; }
.tab { display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 11px; font-weight: 500; color: var(--ink-3); }
.tab.on { color: var(--ink); }
.ic { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.ic.s { width: 18px; height: 18px; } .ic.xs { width: 15px; height: 15px; }
.row { display: flex; align-items: center; gap: 12px; }
.between { justify-content: space-between; }
.large-title { font-size: 30px; font-weight: 700; letter-spacing: -.6px; line-height: 36px; }
.title { font-size: 22px; font-weight: 600; letter-spacing: -.3px; }
.headline { font-size: 17px; font-weight: 600; letter-spacing: -.2px; }
.body { font-size: 15px; line-height: 21px; }
.callout { font-size: 13px; line-height: 18px; color: var(--ink-2); }
.caption { font-size: 12px; font-weight: 500; color: var(--ink-2); }
.muted { color: var(--ink-3); }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-lg); box-shadow: var(--shadow); }
.pad { padding: 14px 16px; }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line); font-size: 13px; font-weight: 500; }
.btn { height: 52px; border-radius: var(--radius); display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 16px; font-weight: 600; letter-spacing: -.1px; }
.btn.primary { background: var(--ink); color: #fff; }
.btn.secondary { background: var(--surface); border: 1px solid var(--line); }
.btn.soft { background: var(--accent-soft); color: var(--accent); }
.logo { width: 34px; height: 34px; border-radius: 9px; background: url(logo.png) center/cover; flex: none; }
.metrics { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.metric { padding: 12px 14px; display: flex; flex-direction: column; gap: 2px; }
.metric b { font-size: 24px; font-weight: 600; letter-spacing: -.6px; line-height: 30px; }
.heat { display: grid; grid-template-columns: repeat(18, 1fr); gap: 3px; }
.heat i { aspect-ratio: 1; border-radius: 3px; background: #ececea; display: block; }
.heat i.l1 { background: #c7d7fb; } .heat i.l2 { background: #8fb0f6; } .heat i.l3 { background: #4f82ee; } .heat i.l4 { background: var(--accent); }
.list { overflow: hidden; }
.item { display: flex; align-items: center; gap: 12px; padding: 13px 16px; border-bottom: 1px solid var(--line); }
.item:last-child { border-bottom: 0; }
.item .t { flex: 1; min-width: 0; }
.item .t div:first-child { font-size: 15px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chip { font-size: 11px; font-weight: 600; padding: 3px 7px; border-radius: 6px; background: var(--surface-2); color: var(--ink-2); border: 1px solid var(--line); flex: none; }
.app-dot { width: 32px; height: 32px; border-radius: 8px; display: grid; place-items: center; color: #fff; font-size: 13px; font-weight: 700; flex: none; }
.seg { display: flex; background: #efefed; border-radius: 10px; padding: 3px; }
.seg span { flex: 1; text-align: center; padding: 7px; border-radius: 8px; font-size: 13px; font-weight: 500; color: var(--ink-2); }
.seg span.on { background: #fff; color: var(--ink); box-shadow: var(--shadow); font-weight: 600; }
.section-label { font-size: 12px; font-weight: 600; color: var(--ink-3); text-transform: uppercase; letter-spacing: .4px; padding: 0 4px; }
.home-ind { position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%); width: 134px; height: 5px; border-radius: 3px; background: #111113; }
.sheet { position: absolute; left: 0; right: 0; bottom: 0; background: var(--surface); border-radius: 28px 28px 0 0; padding: 10px 20px 40px; box-shadow: 0 -10px 40px rgba(0,0,0,.12); display: flex; flex-direction: column; gap: 16px; }
.grabber { width: 38px; height: 5px; border-radius: 3px; background: #d9d9d6; margin: 0 auto 4px; }
.dim { position: absolute; inset: 0; background: rgba(17,17,19,.32); }
.progress { height: 4px; border-radius: 2px; background: #e6e6e3; overflow: hidden; }
.progress i { display: block; height: 100%; background: var(--ink); border-radius: 2px; }
.ctrl { width: 56px; height: 56px; border-radius: 50%; display: grid; place-items: center; }
.ctrl.big { width: 72px; height: 72px; background: var(--ink); color: #fff; }
.hl { display: flex; gap: 10px; font-size: 14px; line-height: 20px; }
.hl::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); margin-top: 7px; flex: none; }
.plan { padding: 16px; display: flex; flex-direction: column; gap: 10px; position: relative; }
.plan.featured { border: 2px solid var(--ink); }
.badge { position: absolute; top: -11px; right: 16px; background: var(--ink); color: #fff; font-size: 11px; font-weight: 600; padding: 4px 9px; border-radius: 999px; }
.price { font-size: 28px; font-weight: 700; letter-spacing: -.8px; }
.price small { font-size: 14px; font-weight: 500; color: var(--ink-2); letter-spacing: 0; }
.feat { display: flex; gap: 8px; font-size: 14px; align-items: flex-start; }
.feat .ic { color: var(--ink); margin-top: 1px; }
.toggle { width: 51px; height: 31px; border-radius: 16px; background: #34c759; position: relative; flex: none; }
.toggle::after { content: ""; position: absolute; right: 2px; top: 2px; width: 27px; height: 27px; border-radius: 50%; background: #fff; box-shadow: 0 2px 4px rgba(0,0,0,.2); }
.lock { background: linear-gradient(180deg, #5b86c9 0%, #2b4f8a 100%); color: #fff; }
.lock .status { color: #fff; }
.live { background: rgba(30,30,32,.72); backdrop-filter: blur(20px); border-radius: 24px; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; color: #fff; }
.island-big { position: absolute; top: 11px; left: 11px; right: 11px; height: 84px; background: #000; border-radius: 42px; z-index: 5; color: #fff; display: flex; align-items: center; gap: 12px; padding: 0 22px 0 14px; }
.wave { display: flex; gap: 3px; align-items: center; height: 22px; }
.wave i { width: 3px; border-radius: 2px; background: #60a5fa; display: block; }
</style>
</head>

<div class="board" id="board"></div>

<template id="status"><div class="status"><span>9:41</span><span class="sys"><i style="width:18px"></i><i style="width:16px"></i><i style="width:26px;height:12px;border-radius:4px"></i></span></div></template>
<template id="tabs-home"><div class="tabbar"><div class="tab on"><svg class="ic"><use href="#home"/></svg>Home</div><div class="tab"><svg class="ic"><use href="#history"/></svg>History</div><div class="tab"><svg class="ic"><use href="#settings"/></svg>Settings</div></div></template>

<script>
const icon = (id, cls = '') => `<svg class="ic ${cls}"><use href="#${id}"/></svg>`;
const status = document.getElementById('status').innerHTML;
const tabs = (on) => `<div class="tabbar">${[['Home', 'home'], ['History', 'history'], ['Settings', 'settings']].map(([l, i]) => `<div class="tab ${l === on ? 'on' : ''}">${icon(i)}${l}</div>`).join('')}</div>`;
const heat = () => { let s = ''; const lv = [0,0,1,0,2,0,0,1,3,2,0,1,4,2,3,0,1,2]; for (let i = 0; i < 18 * 6; i++) { const v = i > 70 ? lv[(i * 7) % 18] : (i % 9 === 0 ? 1 : 0); s += `<i class="${v ? 'l' + v : ''}"></i>`; } return s; };
const screens = [
['1 · Welcome', `
  ${status}
  <div class="content" style="justify-content:center;align-items:center;text-align:center;gap:22px;padding:0 32px">
    <div class="logo" style="width:112px;height:112px;border-radius:26px;box-shadow:0 12px 30px rgba(37,99,235,.25)"></div>
    <div style="display:flex;flex-direction:column;gap:10px"><div class="large-title">Read less.<br>Listen instead.</div>
    <div class="body" style="color:var(--ink-2)">Copy anything long — a post, an email, an AI answer — and Notchman tells you what matters, out loud.</div></div>
    <div class="card pad" style="width:100%;text-align:left;display:flex;flex-direction:column;gap:12px">
      <div class="row">${icon('copy', 's')}<div class="body">Copy or share text from any app</div></div>
      <div class="row">${icon('tldr', 's')}<div class="body">Hear a TL;DR in seconds</div></div>
      <div class="row">${icon('read', 's')}<div class="body">Or the whole thing, read aloud</div></div>
    </div>
  </div>
  <div style="padding:0 24px 46px;display:flex;flex-direction:column;gap:10px"><div class="btn primary">Get started</div><div class="callout" style="text-align:center">Free to start · No account needed</div></div>`],
['2 · Home', `
  ${status}
  <div class="content">
    <div class="row between"><div class="row" style="gap:10px"><div class="logo"></div><div class="headline">Notchman</div></div><span class="pill"><svg class="ic xs" style="color:var(--flame)"><use href="#flame"/></svg>6 day streak</span></div>
    <div><div class="large-title">Good morning</div><div class="callout">Copy something long, then come back.</div></div>
    <div class="card pad row" style="gap:14px;background:var(--ink);border-color:var(--ink);color:#fff">
      <div style="flex:1"><div class="headline" style="color:#fff">Listen to what you copied</div><div class="callout" style="color:#c9c9cf">“Hi team, quick update on the launch…”</div></div>
      <div class="ctrl" style="width:44px;height:44px;background:#fff;color:var(--ink)">${icon('play', 's')}</div>
    </div>
    <div class="metrics">
      <div class="card metric"><span class="caption">TL;DRs</span><b>48</b><span class="callout muted">this month</span></div>
      <div class="card metric"><span class="caption">Time saved</span><b>2 h 10m</b><span class="callout muted">vs reading</span></div>
      <div class="card metric"><span class="caption">Words covered</span><b>31.4k</b><span class="callout muted">you didn’t read</span></div>
      <div class="card metric"><span class="caption">Your speed</span><b>612</b><span class="callout muted">words a minute</span></div>
    </div>
    <div class="card pad" style="display:flex;flex-direction:column;gap:10px"><div class="row between"><div class="headline">Activity</div><span class="caption muted">18 weeks</span></div><div class="heat">${heat()}</div></div>
    <div class="row between"><div class="headline">Recent</div><span class="callout">See all</span></div>
    <div class="card list">
      <div class="item"><div class="app-dot" style="background:#10a37f">C</div><div class="t"><div>Pricing ideas for the beta</div><div class="callout">ChatGPT · 2 min ago</div></div><span class="chip">TL;DR</span></div>
    </div>
  </div>
  ${tabs('Home')}`],
['3 · Ready to listen', `
  ${status}
  <div class="content" style="opacity:.5">
    <div class="large-title">Good morning</div>
    <div class="card pad" style="height:160px"></div><div class="card pad" style="height:220px"></div>
  </div>
  <div class="dim"></div>
  <div class="sheet">
    <div class="grabber"></div>
    <div class="row between"><div class="title">Ready to listen</div><div class="ctrl" style="width:30px;height:30px;background:var(--surface-2)">${icon('close', 'xs')}</div></div>
    <div class="card pad" style="background:var(--surface-2);box-shadow:none;display:flex;flex-direction:column;gap:6px">
      <div class="row" style="gap:8px"><div class="app-dot" style="width:22px;height:22px;border-radius:6px;font-size:10px;background:#0a66c2">in</div><span class="caption">From LinkedIn · 412 words</span></div>
      <div class="body" style="display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden">We closed our seed round last week. 14 months ago I quit my job with ₹3 lakh in savings and an idea everyone called too small. Here are the three things that actually mattered…</div>
    </div>
    <div class="btn primary">${icon('tldr', 's')}TL;DR · about 40 sec</div>
    <div class="btn secondary">${icon('read', 's')}Read it all · 2 min 40</div>
    <div class="row between callout"><span class="row" style="gap:6px">${icon('globe', 'xs')}Language: Same as the text</span><span class="row" style="gap:4px">Voice: Rachel ${icon('down', 'xs')}</span></div>
  </div>`],
['4 · Player', `
  ${status}
  <div class="content" style="gap:18px">
    <div class="row between"><div class="ctrl" style="width:36px;height:36px;background:var(--surface);border:1px solid var(--line)">${icon('down', 's')}</div><span class="caption">TL;DR · LinkedIn</span><div class="ctrl" style="width:36px;height:36px;background:var(--surface);border:1px solid var(--line)">${icon('more', 's')}</div></div>
    <div><div class="title" style="line-height:28px">A founder raised $2.1M after reaching $18k a month</div></div>
    <div class="body" style="color:var(--ink-2)"><span style="color:var(--ink);background:var(--accent-soft);border-radius:4px;padding:0 2px">They didn’t pitch anyone until 40 customers were paying,</span> so investors stopped asking “will anyone pay?” and asked how fast it could grow. Churn fell from 9% to 2.5% after a 15-minute setup call…</div>
    <div class="card pad" style="display:flex;flex-direction:column;gap:10px">
      <div class="caption">Highlights</div>
      <div class="hl">$2.1M seed round, led by Peak Ventures</div>
      <div class="hl">$18k monthly revenue from 40 customers, +22% a month</div>
      <div class="hl">Next: 6 engineers in Bengaluru, Southeast Asia in Q1</div>
    </div>
    <div style="margin-top:auto;display:flex;flex-direction:column;gap:8px">
      <div class="progress"><i style="width:38%"></i></div>
      <div class="row between caption muted"><span>0:15</span><span>-0:24</span></div>
    </div>
    <div class="row" style="justify-content:space-between;padding:0 18px">
      <span class="pill">1×</span>
      <div class="ctrl">${icon('back')}</div>
      <div class="ctrl big">${icon('pause')}</div>
      <div class="ctrl">${icon('forward')}</div>
      <div class="ctrl" style="width:36px">${icon('read', 's')}</div>
    </div>
    <div class="row" style="justify-content:center;padding-bottom:34px"><span class="pill">${icon('bookmark', 'xs')}Save</span><span class="pill" style="margin-left:8px">${icon('share', 'xs')}Share</span></div>
  </div>`],
['5 · Dynamic Island & Lock Screen', `
  <div class="lock" style="position:absolute;inset:0"></div>

  </div>

  <div class="content" style="gap:14px">

['8 · Settings', `

  <div class="content" style="gap:12px">

document.getElementById('board').innerHTML = screens.map(([name, html]) =>
  `<div class="screen-wrap"><div class="screen-name">${name}</div><div class="phone" data-name="${name}"><div class="island"></div>${html}<div class="home-ind"${name.startsWith('5') ? ' style="background:#fff"' : ''}></div></div></div>`).join('');
</script>
</body>
