# Notchman — XcodeGen project definition.
#
# The .xcodeproj is generated from this file and is not committed:
#   brew install xcodegen && xcodegen generate && open Notchman.xcodeproj
#
# Before running on a device, set DEVELOPMENT_TEAM below (or in Xcode) and make
# sure the App Group in APP_GROUP_ID is registered for your team.

name: Notchman

options:
  bundleIdPrefix: com.notchman
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: 12.0.0

settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1"
    APP_GROUP_ID: group.app.notchman
    APP_BUNDLE_ID: app.notchman

targets:
  # MARK: - App
  Notchman:
    type: application
    platform: iOS
    sources:
      - path: Notchman
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID)
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
    info:
      path: Notchman/App/Info.plist
      properties:
        CFBundleDisplayName: Notchman
        NotchmanAppGroup: $(APP_GROUP_ID)
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        # Portrait-only, so the app must opt out of iPad multitasking.
        UIRequiresFullScreen: true
        UIBackgroundModes: [audio]
        NSSupportsLiveActivities: true
        UIAppFonts: [Silkscreen-Bold.ttf, Silkscreen-Regular.ttf]
        UIUserInterfaceStyle: Dark
        ITSAppUsesNonExemptEncryption: false
        CFBundleURLTypes:
          - CFBundleURLName: $(APP_BUNDLE_ID)
            CFBundleURLSchemes: [notchman]
    entitlements:
      path: Notchman/App/Notchman.entitlements
      properties:
        com.apple.security.application-groups: [$(APP_GROUP_ID)]
        com.apple.developer.applesignin: [Default]
        # App Check uses App Attest to prove requests come from the genuine app.
        com.apple.developer.devicecheck.appattest-environment: production
    dependencies:
      - package: Firebase
        product: FirebaseCore
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseFunctions
      - package: Firebase
        product: FirebaseAppCheck
      - target: NotchmanShare
      - target: NotchmanWidgets
      - target: NotchmanSafari
      - target: NotchmanScreen
    scheme:
      testTargets: [NotchmanTests]
      gatherCoverageData: true
      # Lets Premium purchases be tested in the simulator without App Store Connect.
      storeKitConfiguration: StoreKit/Notchman.storekit

  # MARK: - Share Extension ("Listen with Notchman")
  NotchmanShare:
    type: app-extension
    platform: iOS
    sources:
      - path: Extensions/ShareExtension
      - Notchman/Core/Shared
      - Notchman/Core/Extraction
      - Notchman/Core/Text
      - Notchman/Core/Storage/SharedInbox.swift
      - Notchman/Core/Storage/AppSettings.swift
      - Notchman/Models/SourceType.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID).share
        APPLICATION_EXTENSION_API_ONLY: YES
    info:
      path: Extensions/ShareExtension/Info.plist
      properties:
        CFBundleDisplayName: Listen with Notchman
        NotchmanAppGroup: $(APP_GROUP_ID)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionJavaScriptPreprocessingFile: Preprocessing
            NSExtensionActivationRule:
              NSExtensionActivationSupportsText: true
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsWebPageWithMaxCount: 1
              NSExtensionActivationSupportsImageWithMaxCount: 1
    entitlements:
      path: Extensions/ShareExtension/NotchmanShare.entitlements
      properties:
        com.apple.security.application-groups: [$(APP_GROUP_ID)]

  # MARK: - Screen reading (ReplayKit broadcast upload extension, on-device only)
  NotchmanScreen:
    type: app-extension
    platform: iOS
    sources:
      - path: Extensions/ScreenBroadcast
      - Notchman/Core/Shared/AppGroup.swift
      - Notchman/Core/Shared/ScreenFrames.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID).screen
        APPLICATION_EXTENSION_API_ONLY: YES
    info:
      path: Extensions/ScreenBroadcast/Info.plist
      properties:
        CFBundleDisplayName: Notchman Screen Reading
        NotchmanAppGroup: $(APP_GROUP_ID)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.broadcast-services-upload
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).SampleHandler
          RPBroadcastProcessMode: RPBroadcastProcessModeSampleBuffer
    entitlements:
      path: Extensions/ScreenBroadcast/NotchmanScreen.entitlements
      properties:
        com.apple.security.application-groups: [$(APP_GROUP_ID)]

  # MARK: - Live Activity / Dynamic Island widget
  NotchmanWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Extensions/LiveActivityWidget
      - Notchman/Core/LiveActivity/NotchmanActivityAttributes.swift
      - Notchman/Core/Intents/PlaybackControlIntents.swift
      - Notchman/Core/Intents/TLDRControl.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID).widgets
        APPLICATION_EXTENSION_API_ONLY: YES
    info:
      path: Extensions/LiveActivityWidget/Info.plist
      properties:
        CFBundleDisplayName: Notchman
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

  # MARK: - Safari Web Extension
  NotchmanSafari:
    type: app-extension
    platform: iOS
    sources:
      - path: Extensions/SafariExtension
        excludes:
          - "Resources"
          - "Resources/**"
      # Web extension files must sit flat at the .appex root (a top-level
      # "Resources" folder makes iOS treat the bundle as macOS-style).
      - path: Extensions/SafariExtension/Resources
        excludes:
          - "images"
          - "images/**"
        buildPhase: resources
      - path: Extensions/SafariExtension/Resources/images
        type: folder
        buildPhase: resources
      - Notchman/Core/Shared
      - Notchman/Core/Extraction
      - Notchman/Core/Text
      - Notchman/Core/Storage/SharedInbox.swift
      - Notchman/Core/Storage/AppSettings.swift
      - Notchman/Models/SourceType.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID).safari
        APPLICATION_EXTENSION_API_ONLY: YES
    info:
      path: Extensions/SafariExtension/Info.plist
      properties:
        CFBundleDisplayName: Notchman
        NotchmanAppGroup: $(APP_GROUP_ID)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.Safari.web-extension
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).SafariWebExtensionHandler
    entitlements:
      path: Extensions/SafariExtension/NotchmanSafari.entitlements
      properties:
        com.apple.security.application-groups: [$(APP_GROUP_ID)]

  # MARK: - Unit tests
  NotchmanTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: NotchmanTests
    dependencies:
      - target: Notchman
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID).tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Notchman.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Notchman
        BUNDLE_LOADER: $(TEST_HOST)
