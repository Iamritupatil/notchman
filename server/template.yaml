AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  Notchman API: TL;DR summaries (Groq) and voice (ElevenLabs), with
  per-install and total daily limits in DynamoDB. Deploy with
  `npm run deploy:first` (see README.md), or from GitHub Actions.

Parameters:
  # Firebase is no longer used; these stay so saved deploy settings still work.
  FirebaseProjectId:
    Type: String
    Default: ""
    Description: Unused.
  FirebaseProjectNumber:
    Type: String
    Default: ""
    Description: Unused.
  FirebaseAppId:
    Type: String
    Default: ""
    Description: Unused.
  GlobalDailyTLDRs:
    Type: Number
    Default: 1000
    Description: Most TL;DRs per day across all users, a spending cap.
  ProUpgradeLink:
    Type: String
    Default: ''
    Description: 'Desktop Upgrade to Pro: a RevenueCat Web Purchase Link; {userId} becomes the install ID.'
  ProPlusUpgradeLink:
    Type: String
    Default: ''
    Description: 'Desktop Upgrade to Pro+: a RevenueCat Web Purchase Link; {userId} becomes the install ID.'
  GlobalDailyVoiceCharacters:
    Type: Number
    Default: 2000
    Description: 'Most ElevenLabs characters per day across all users: a spending cap. 2000 characters is about 1,000 credits a day on Flash (about 30k a month). Past it, the apps use their free voices.'
  BetaMonthlyVoiceCharacters:
    Type: Number
    Default: 3000
    Description: ElevenLabs characters per free user per month (about 3 minutes of listening). 0 turns it off.
  FreeTrialVoiceCharacters:
    Type: Number
    Default: 2500
    Description: 'Free plan: ElevenLabs characters per install, once (about 3 TL;DRs). Then the free voices.'
  FreeMonthlyVoiceCharacters:
    Type: Number
    Default: 8000
    Description: 'Free users'' share of the Notchman voice (ElevenLabs) per month, across everyone (about 30% of the budget). Past it, free users hear the free voices; paying users are never affected. 0 = no monthly cap.'
  VoiceReserveCredits:
    Type: Number
    Default: 2000
    Description: 'ElevenLabs credits kept in reserve: below this, no free-plan ElevenLabs audio; below a fifth of it, none at all.'
  AlertEmail:
    Type: String
    Default: vasukispace@gmail.com
    Description: 'Where usage alerts go (AWS sends a one-time "Confirm subscription" email first).'
  ElevenLabsMonthlyBudget:
    Type: Number
    Default: 27000
    Description: 'ElevenLabs characters a month you are happy to spend; emails at 50%, 80% and 95%.'
  IpMonthlyTLDRs:
    Type: Number
    Default: 45
    Description: 'Free TL;DRs per network (IP address) per month, across every computer on it (offices and colleges share one).'
  IpMonthlyVoiceCharacters:
    Type: Number
    Default: 15000
    Description: 'Free Notchman-voice (ElevenLabs) characters per network (IP address) per month.'
  DodoEnvironment:
    Type: String
    Default: auto
    AllowedValues: [auto, live_mode, test_mode]
    Description: 'Dodo Payments: auto tries live, then test (the API key decides); or force live_mode / test_mode.'
  DodoProProductId:
    Type: String
    Default: pdt_0Np3ZwVvRoayoVU39PWND
    Description: 'Dodo Payments product ID of the Pro subscription.'
  DodoProPlusProductId:
    Type: String
    Default: pdt_0Np3aAcxKtKbj0iPwA95q
    Description: 'Dodo Payments product ID of the Pro+ subscription.'
  AzureSpeechRegion:
    Type: String
    Default: eastus
    Description: 'Region of the Azure AI Speech resource (standard voice). Its key goes in Parameter Store as /notchman/AZURE_SPEECH_KEY.'
  StandardInstallMonthlyCharacters:
    Type: Number
    Default: 40000
    Description: 'Standard (Azure) voice characters per install per month.'
  StandardMonthlyCharacters:
    Type: Number
    Default: 480000
    Description: 'Standard (Azure) voice characters per month across everyone: stays inside the free tier (500,000).'
  BetaMonthlyTLDRs:
    Type: Number
    Default: 15
    Description: Cloud TL;DRs per user per month without a subscription. 0 turns it off.
  GroqModel:
    Type: String
    Default: openai/gpt-oss-120b
  AiOrder:
    Type: String
    Default: bedrock-first
    AllowedValues: [groq-first, bedrock-first]
    Description: 'groq-first: Groq (fastest) writes TL;DRs and Bedrock takes over when it can''t; bedrock-first: the other way round.'
  BedrockModels:
    Type: String
    Default: openai.gpt-oss-120b-1:0,global.amazon.nova-2-lite-v1:0
    Description: 'Claude models in Amazon Bedrock that write TL;DRs, best first (comma-separated); if all fail, Groq does. Empty: Groq only. For faster, cheaper TL;DRs: anthropic.claude-haiku-5-5.'
  ElevenLabsVoiceId:
    Type: String
    Default: EXAVITQu4vr4xnSDxMaL
  ElevenLabsModel:
    Type: String
    Default: unused
    Description: Deprecated (kept so saved deploy settings still work). Use VoiceModel.
  VoiceModel:
    Type: String
    Default: eleven_flash_v2_5
    Description: ElevenLabs model. eleven_flash_v2_5 is fast and half the credits; eleven_multilingual_v2 sounds a little more natural.
  AppleAppId:
    Type: String
    Default: "6816657500"
    Description: The app's numeric Apple ID. Needed to accept real App Store purchases.
  AllowXcodeTransactions:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: Development only. Must be false in production.

Resources:
  # Usage alerts by email to AlertEmail.
  AlertTopic:
    Type: AWS::SNS::Topic
    Properties:
      DisplayName: Notchman
      Subscription:
        - Protocol: email
          Endpoint: !Ref AlertEmail

  QuotaTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true

  ApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: dist/
      Handler: lambda.handler
      Runtime: nodejs22.x
      Architectures: [arm64]
      # More memory also means a faster CPU: quicker cold starts and replies.
      MemorySize: 1024
      Timeout: 75
      # A ping every 5 minutes keeps an instance warm, so nobody waits for a
      # cold start (a few seconds) on their first TL;DR. Costs ~9k tiny calls a month.
      Events:
        KeepWarm:
          Type: Schedule
          Properties:
            Schedule: rate(5 minutes)
            Input: '{"warm":true}'
        # Emails the owner when the Notchman voice nears this month's budget.
        UsageCheck:
          Type: Schedule
          Properties:
            Schedule: rate(1 hour)
            Input: '{"task":"usage-check"}'
        # Mondays: last week's website numbers by email.
        SiteReport:
          Type: Schedule
          Properties:
            Schedule: cron(30 3 ? * MON *)
            Input: '{"task":"site-report-email"}'
      Environment:
        Variables:
          QUOTA_TABLE: !Ref QuotaTable
          SECRETS_PREFIX: /notchman/
          PRO_UPGRADE_LINK: !Ref ProUpgradeLink
          PROPLUS_UPGRADE_LINK: !Ref ProPlusUpgradeLink
          GLOBAL_DAILY_TLDRS: !Ref GlobalDailyTLDRs
          GLOBAL_DAILY_VOICE_CHARACTERS: !Ref GlobalDailyVoiceCharacters
          BETA_MONTHLY_TLDRS: !Ref BetaMonthlyTLDRs
          BETA_MONTHLY_VOICE_CHARACTERS: !Ref BetaMonthlyVoiceCharacters
          FREE_TRIAL_VOICE_CHARACTERS: !Ref FreeTrialVoiceCharacters
          FREE_MONTHLY_VOICE_CHARACTERS: !Ref FreeMonthlyVoiceCharacters
          VOICE_RESERVE_CREDITS: !Ref VoiceReserveCredits
          AZURE_SPEECH_REGION: !Ref AzureSpeechRegion
          ALERT_TOPIC_ARN: !Ref AlertTopic
          ELEVENLABS_MONTHLY_BUDGET: !Ref ElevenLabsMonthlyBudget
          IP_MONTHLY_TLDRS: !Ref IpMonthlyTLDRs
          IP_MONTHLY_VOICE_CHARACTERS: !Ref IpMonthlyVoiceCharacters
          DODO_ENVIRONMENT: !Ref DodoEnvironment
          DODO_PRO_PRODUCT_ID: !Ref DodoProProductId
          DODO_PROPLUS_PRODUCT_ID: !Ref DodoProPlusProductId
          STANDARD_INSTALL_MONTHLY_CHARACTERS: !Ref StandardInstallMonthlyCharacters
          STANDARD_MONTHLY_CHARACTERS: !Ref StandardMonthlyCharacters
          GROQ_MODEL: !Ref GroqModel
          BEDROCK_MODELS: !Ref BedrockModels
          AI_ORDER: !Ref AiOrder
          ELEVENLABS_VOICE_ID: !Ref ElevenLabsVoiceId
          ELEVENLABS_MODEL: !Ref VoiceModel
          APPLE_BUNDLE_ID: app.notchman
          APPLE_APP_ID: !Ref AppleAppId
          ALLOW_XCODE_TRANSACTIONS: !Ref AllowXcodeTransactions
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref QuotaTable
        - SSMParameterReadPolicy:
            ParameterName: notchman/*
        - SNSPublishMessagePolicy:
            TopicName: !GetAtt AlertTopic.TopicName
        # Claude in Amazon Bedrock (the Messages API endpoint, bedrock-mantle).
        - Statement:
            - Effect: Allow
              Action: bedrock-mantle:CreateInference
              Resource: '*'
            # Other Bedrock models (gpt-oss, Claude through cross-region profiles…), through the Converse API.
            - Effect: Allow
              Action: [bedrock:InvokeModel, bedrock:InvokeModelWithResponseStream]
              Resource: '*'
      FunctionUrlConfig:
        AuthType: NONE

Outputs:
  ApiUrl:
    Description: Give this URL to Claude (it isn't secret); the app calls it for TL;DRs.
    Value: !GetAtt ApiFunctionUrl.FunctionUrl
