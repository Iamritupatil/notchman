<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'">
  <title>Welcome to Notchman</title>
  <link rel="stylesheet" href="agree.css">
</head>
<body>
  <main>
    <img class="shiba" src="../../assets/shiba-face.png" alt="">
    <h1>Welcome to Notchman</h1>
    <p class="lead">Read less. Listen instead.</p>

    <ul class="rows" id="rows">
      <li><span class="ico">✦</span>Groq writes the TL;DR</li>
      <li><span class="ico">≋</span>ElevenLabs speaks it</li>
      <li><span class="ico">⚿</span>Your text isn't stored</li>
    </ul>
    <ul class="rows gone" id="communityRows">
      <li><span class="ico">✦</span>Your text goes only to the services whose keys you add</li>
      <li><span class="ico">⚿</span>Nothing is sent to Notchman</li>
    </ul>

    <label class="agree" id="agreeBox">
      <input type="checkbox" id="agree">
      <span class="tick" aria-hidden="true"></span>
      <span>I agree to the <a href="https://notchman.app/terms" target="_blank">Terms of Service</a> and <a href="https://notchman.app/privacy" target="_blank">Privacy Policy</a></span>
    </label>

    <button class="primary" id="continue" disabled>Continue</button>
    <button class="quiet" id="quit">Quit</button>
  </main>
  <script src="agree.js"></script>
</body>
</html>
