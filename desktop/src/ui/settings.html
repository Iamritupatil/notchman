<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; media-src 'self' blob:; img-src 'self' data:; style-src 'self'; script-src 'self'">
  <title>Notchman Settings</title>
  <link rel="stylesheet" href="settings.css">
</head>
<body>
  <header>
    <img src="../../assets/mascot.png" alt="">
    <div>
      <h1>Notchman</h1>
      <p>Copy anything, press <kbd id="tldrKeyLabel">Alt+T</kbd>, hear what matters.</p>
    </div>
  </header>

  <section>
    <h2>Voice</h2>
    <div id="voices" class="voices"></div>
  </section>

  <section>
    <h2>Speed</h2>
    <div class="segmented" id="speeds"></div>
  </section>

  <section>
    <h2>Shortcuts</h2>
    <label class="row">TL;DR <select id="tldrShortcut"></select></label>
    <label class="row">Read in full <select id="readShortcut"></select></label>
  </section>

  <section>
    <label class="row check"><input type="checkbox" id="openAtLogin"> Start Notchman when the computer starts</label>
  </section>

  <footer id="version"></footer>
  <script src="settings.js"></script>
</body>
</html>
