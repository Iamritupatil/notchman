AWSTemplateFormatVersion: "2010-09-09"
Description: 'Notchman desktop downloads: a private S3 bucket served through CloudFront (free tier: 1 TB a month).'

# The installers are public; the source code stays private. CI uploads each
# build to desktop-<n>/ and latest/, and writes latest.json for the in-app updater.

Resources:
  Bucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: old-builds
            Status: Enabled
            Prefix: desktop-
            ExpirationInDays: 120

  AccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "${AWS::StackName}-oac"
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: Notchman desktop downloads
        PriceClass: PriceClass_All
        HttpVersion: http2and3
        Origins:
          - Id: downloads
            DomainName: !GetAtt Bucket.RegionalDomainName
            OriginAccessControlId: !GetAtt AccessControl.Id
            S3OriginConfig:
              OriginAccessIdentity: ""
        DefaultCacheBehavior:
          TargetOriginId: downloads
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD]
          Compress: true
          # Managed "CachingOptimized": follows each file's Cache-Control.
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6

  BucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref Bucket
      PolicyDocument:
        Statement:
          - Effect: Allow
            Principal: { Service: cloudfront.amazonaws.com }
            Action: s3:GetObject
            Resource: !Sub "${Bucket.Arn}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribution}"

Outputs:
  BucketName:
    Value: !Ref Bucket
  DistributionId:
    Value: !Ref Distribution
  DownloadsUrl:
    Value: !Sub "https://${Distribution.DomainName}"
