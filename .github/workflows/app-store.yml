name: App Store

# iPhone subscriptions in App Store Connect (scripts/asc.py), with the same
# API key as TestFlight. "status" only reads; "setup" creates what's missing:
# the Notchman Premium group, Pro ($4.99) and Pro+ ($9.99) monthly, their
# names, prices in every country, and availability. "review-screenshot"
# uploads the paywall screenshot App Review needs; "builds" lists the latest
# TestFlight builds, whether they can be installed, and the tester groups.
on:
  workflow_dispatch:
    inputs:
      action:
        description: status (read only), setup (create what's missing), review-screenshot (upload docs/screenshots/paywall.png) builds (TestFlight builds and testers) readiness (what App Review still needs), listing (apply design/store/listing.json) store-screenshots (upload docs/store/main) declarations (age rating, content rights), custom-pages (study, work, focus, ai, shiba) or submit-subscriptions (Pro and Pro+ for review)
        type: choice
        options: [status, setup, review-screenshot, builds, readiness, listing, store-screenshots, declarations, custom-pages, submit-subscriptions]
        default: status

jobs:
  asc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install --quiet pyjwt cryptography
      - name: App Store Connect
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          APP_BUNDLE_ID: ${{ vars.APP_BUNDLE_ID }}
        run: python3 scripts/asc.py ${{ inputs.action }} | tee -a "$GITHUB_STEP_SUMMARY"
