name: App Store

# iPhone subscriptions in App Store Connect (scripts/asc.py), with the same
# API key as TestFlight. "status" only reads; "setup" creates what's missing:
# the Notchman Premium group, Pro ($4.99) and Pro+ ($9.99) monthly, their
# names, prices in every country, and availability. "review-screenshot"
# uploads the paywall screenshot App Review needs.
on:
  workflow_dispatch:
    inputs:
      action:
        description: status (read only), setup (create what's missing) or review-screenshot (upload docs/screenshots/paywall.png)
        type: choice
        options: [status, setup, review-screenshot]
        default: status

jobs:
  asc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install --quiet pyjwt cryptography
      - name: App Store Connect
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          APP_BUNDLE_ID: ${{ vars.APP_BUNDLE_ID }}
        run: python3 scripts/asc.py ${{ inputs.action }} | tee -a "$GITHUB_STEP_SUMMARY"
