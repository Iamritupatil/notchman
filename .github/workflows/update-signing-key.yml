name: Update signing key

# The key that signs latest.json, so the desktop app only installs updates
# Notchman's own release job published. Makes an Ed25519 key once and keeps
# it in AWS Parameter Store (/notchman/UPDATE_SIGNING_KEY, SecureString); the
# public half, printed here, is built into the app (desktop/src/config.js).
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  key:
    runs-on: ubuntu-latest
    steps:
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1
      - name: The signing key (made once), and its public half
        run: |
          set -euo pipefail
          umask 077
          KEY="$RUNNER_TEMP/update-key.pem"
          if aws ssm get-parameter --name /notchman/UPDATE_SIGNING_KEY --with-decryption --query Parameter.Value --output text > "$KEY" 2>/dev/null; then
            echo "Using the signing key in Parameter Store."
          else
            openssl genpkey -algorithm ed25519 -out "$KEY"
            aws ssm put-parameter --name /notchman/UPDATE_SIGNING_KEY --type SecureString --value "file://$KEY" >/dev/null
            echo "Made a new signing key and saved it to Parameter Store."
          fi
          { echo '### Public key (goes in desktop/src/config.js)'; echo '```'; openssl pkey -in "$KEY" -pubout; echo '```'; } | tee -a "$GITHUB_STEP_SUMMARY"
          # The latest.json published now gets its signature too (later releases sign their own).
          BUCKET=$(aws cloudformation describe-stacks --stack-name notchman-downloads --query "Stacks[0].Outputs[?OutputKey=='BucketName'].OutputValue" --output text)
          DIST=$(aws cloudformation describe-stacks --stack-name notchman-downloads --query "Stacks[0].Outputs[?OutputKey=='DistributionId'].OutputValue" --output text)
          aws s3 cp "s3://$BUCKET/latest.json" "$RUNNER_TEMP/latest.json" --only-show-errors
          openssl pkeyutl -sign -inkey "$KEY" -rawin -in "$RUNNER_TEMP/latest.json" | base64 -w0 > "$RUNNER_TEMP/latest.json.sig"
          openssl pkeyutl -verify -pubin -inkey <(openssl pkey -in "$KEY" -pubout) -rawin -in "$RUNNER_TEMP/latest.json" -sigfile <(base64 -d "$RUNNER_TEMP/latest.json.sig")
          aws s3 cp "$RUNNER_TEMP/latest.json.sig" "s3://$BUCKET/latest.json.sig" --content-type text/plain --cache-control "public, max-age=60" --only-show-errors
          aws cloudfront create-invalidation --distribution-id "$DIST" --paths "/latest.json.sig" --query Invalidation.Id --output text
          rm -f "$KEY"
