name: Community

# The public Notchman Community repo is exported from desktop/ by
# scripts/export-community.js. This checks the export on every change: no
# private files or values, tests pass, and the app starts on Windows and Mac.
on:
  workflow_dispatch:
  push:
    paths:
      - desktop/**
      - .github/workflows/community.yml

permissions:
  contents: read

jobs:
  export:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Export (with safety checks)
        run: node desktop/scripts/export-community.js community-out
      - name: Install and test like a new user
        working-directory: community-out
        run: |
          npm install --no-audit --no-fund
          npm test
      - name: The app starts (self-test with the free voice)
        working-directory: community-out
        timeout-minutes: 8
        shell: bash
        run: |
          npx electron . --self-test=none --self-test-out="$PWD/self-test.txt" || true
          cat self-test.txt
          grep -q 'Kokoro voice: ok' self-test.txt
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        if: runner.os == 'macOS'
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1
      # Catches what unit tests can't, like Groq retiring the default model.
      - name: A real TL;DR through Groq, made the way Community makes it
        if: runner.os == 'macOS'
        working-directory: community-out
        run: |
          KEY=$(aws ssm get-parameter --name /notchman/GROQ_API_KEY --with-decryption --query Parameter.Value --output text)
          echo "::add-mask::$KEY"
          GROQ_API_KEY="$KEY" node -e "
            const { createClient } = require('./src/core/byok');
            const { createKeyStore } = require('./src/key-store');
            createClient({ keys: createKeyStore({ env: process.env }) })
              .tldr('The team meeting moved from Tuesday to Thursday at 3 pm because the client asked for more time. Bring the Q3 budget numbers and the updated slides. Priya will present the new timeline.')
              .then((summary) => { console.log('TL;DR:', summary); if (!/Thursday/i.test(summary)) process.exit(1); })
              .catch((error) => { console.error(error.message); process.exit(1); });"
