name: TL;DR quality

# Runs realistic texts through the real TL;DR pipeline (Groq) and scores how
# many important facts and numbers each summary keeps (server/eval). By hand
# only: it uses the same Groq quota as the apps.
on:
  workflow_dispatch:
    inputs:
      baseline_ref:
        description: Also score the pipeline at this commit first (for a before/after)
        required: false
      cases:
        description: Only these cases, comma-separated parts of their names (e.g. "Research paper")
        required: false
      model:
        description: Groq model to score instead of the default (e.g. the long-text model)
        required: false
      language:
        description: Ask for the TL;DRs in this language ("hi" for everyday Hindi, "en"); the text's own by default
        required: false
      bedrock_models:
        description: Score Claude in Amazon Bedrock instead of Groq (e.g. "anthropic.claude-opus-5-5"); Groq isn't used then
        required: false
      list_models:
        description: Only list the Groq models this key can use, with their per-minute token limits
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 50
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1
      - name: Groq models and their limits on this account
        if: inputs.list_models
        run: |
          KEY=$(aws ssm get-parameter --name /notchman/GROQ_API_KEY --with-decryption --query Parameter.Value --output text)
          echo "::add-mask::$KEY"
          echo '| Model | Context | Tokens/min | Requests/day |' >> "$GITHUB_STEP_SUMMARY"
          echo '|---|---|---|---|' >> "$GITHUB_STEP_SUMMARY"
          curl -sS https://api.groq.com/openai/v1/models -H "Authorization: Bearer $KEY" |
            jq -r '.data[] | select(.active != false) | select(.id | test("whisper|tts|guard|orpheus|playai|compound") | not) | "\(.id) \(.context_window)"' | sort |
            while read -r model context; do
              headers=$(curl -sS -D - -o /dev/null https://api.groq.com/openai/v1/chat/completions -H "Authorization: Bearer $KEY" \
                -H 'Content-Type: application/json' -d "{\"model\":\"$model\",\"max_completion_tokens\":1,\"messages\":[{\"role\":\"user\",\"content\":\"ok\"}]}")
              tpm=$(echo "$headers" | tr -d '\r' | awk -F': ' 'tolower($1)=="x-ratelimit-limit-tokens"{print $2}')
              rpd=$(echo "$headers" | tr -d '\r' | awk -F': ' 'tolower($1)=="x-ratelimit-limit-requests"{print $2}')
              echo "| $model | $context | ${tpm:-?} | ${rpd:-?} |" | tee -a "$GITHUB_STEP_SUMMARY"
            done
      - name: Score the TL;DRs
        if: ${{ !inputs.list_models }}
        env:
          EVAL_CASES: ${{ inputs.cases }}
          GROQ_MODEL: ${{ inputs.model || 'openai/gpt-oss-120b' }}
          BEDROCK_MODELS: ${{ inputs.bedrock_models }}
          EVAL_LANGUAGE: ${{ inputs.language }}
          BASELINE_REF: ${{ inputs.baseline_ref }}
          # Raw model answers of the test texts (never set on the server).
          TLDR_DEBUG: "1"
        run: |
          KEY=$(aws ssm get-parameter --name /notchman/GROQ_API_KEY --with-decryption --query Parameter.Value --output text)
          echo "::add-mask::$KEY"
          # Bedrock has no per-minute squeeze worth pausing for, and Groq stays out of it.
          if [ -n "$BEDROCK_MODELS" ]; then
            KEY=""; export EVAL_PAUSE_SECONDS=0
            # The Bedrock API key, if there is one in Parameter Store (as the server uses it).
            TOKEN=$(aws ssm get-parameter --name /notchman/AWS_BEARER_TOKEN_BEDROCK --with-decryption --query Parameter.Value --output text 2>/dev/null || true)
            if [ -n "$TOKEN" ]; then echo "::add-mask::$TOKEN"; export AWS_BEARER_TOKEN_BEDROCK="$TOKEN"; echo "Using the Bedrock API key"; fi
          fi
          if [ -n "$BASELINE_REF" ]; then
            cp src/summarize.ts /tmp/summarize.new.ts
            git show "$BASELINE_REF:server/src/summarize.ts" > src/summarize.ts
            GROQ_API_KEY="$KEY" EVAL_LABEL=before EVAL_PAUSE_SECONDS=90 npm run eval | tee before.txt
            sed -n '/=== Score/,$p' before.txt >> "$GITHUB_STEP_SUMMARY"
            cp /tmp/summarize.new.ts src/summarize.ts
            sleep 70
          fi
          GROQ_API_KEY="$KEY" EVAL_LABEL=after npm run eval | tee eval.txt
          sed -n '/=== Score/,$p' eval.txt >> "$GITHUB_STEP_SUMMARY"
          grep -h "Groq limits" before.txt eval.txt 2>/dev/null | head -1 >> "$GITHUB_STEP_SUMMARY"
