name: Desktop

# Builds the Windows installer (Notchman-Setup.exe) and the Mac app
# (Notchman.dmg) on GitHub's machines and publishes them as a GitHub Release,
# so these links always serve the newest build (for the website's buttons):
#   https://dy7adwloxsruv.cloudfront.net/latest/Notchman-Setup.exe
#   https://dy7adwloxsruv.cloudfront.net/latest/Notchman.dmg  (Apple silicon)
#   https://dy7adwloxsruv.cloudfront.net/latest/Notchman-Intel.dmg
# (the public downloads site, deploy/downloads; the GitHub release is private.)
# Runs by hand, and on pushes that change the desktop app.
on:
  workflow_dispatch:
  push:
    paths:
      - "desktop/**"
      - ".github/workflows/desktop.yml"

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - name: Built-in text recognition (Windows OCR)
        run: node scripts/ocr-smoke.js
        continue-on-error: true
      - name: Free on-computer voice (Kokoro)
        run: npx electron scripts/kokoro-smoke.js
        continue-on-error: true
        timeout-minutes: 8
      - name: Version from the build number (shown in the tray menu)
        run: npm pkg set version=0.1.${{ github.run_number }}
      - run: npm run dist
      - name: Self-test the built app (screen reading and voice)
        timeout-minutes: 6
        run: |
          Start-Process -FilePath dist/win-unpacked/Notchman.exe -ArgumentList "--self-test=$PWD\test\fixtures\screen-text.png","--self-test-out=$PWD\self-test.txt" -Wait
          Get-Content self-test.txt
          if (-not (Select-String -Path self-test.txt -Pattern 'Tesseract OCR: ok' -Quiet)) { exit 1 }
          if (-not (Select-String -Path self-test.txt -Pattern 'built-in OCR: ok' -Quiet)) { exit 1 }
          if (-not (Select-String -Path self-test.txt -Pattern 'update check: ok' -Quiet)) { exit 1 }
      - name: Silent install works (how automatic updates install), also over a running Notchman
        timeout-minutes: 8
        shell: pwsh
        run: |
          function Install-Silently {
            # WaitForExit, not -Wait: -Wait would also wait for the Notchman it starts.
            $p = Start-Process -FilePath dist/Notchman-Setup.exe -ArgumentList '/S','--updated','--force-run' -PassThru
            if (-not $p.WaitForExit(240000)) { throw "installer did not finish" }
            Write-Host "installer exit code: $($p.ExitCode)"
            if ($p.ExitCode -ne 0) { throw "installer failed" }
            Start-Sleep -Seconds 10
          }
          Install-Silently
          $exe = Get-ChildItem "$env:LOCALAPPDATA\Programs" -Recurse -Filter Notchman.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $exe) { throw "Notchman.exe was not installed" }
          Write-Host "installed: $($exe.FullName) version $($exe.VersionInfo.ProductVersion)"
          if (-not (Get-Process Notchman -ErrorAction SilentlyContinue)) { throw "Notchman did not start after the silent install" }
          # Again while it's running, like an update does.
          Install-Silently
          if (-not (Get-Process Notchman -ErrorAction SilentlyContinue)) { throw "Notchman did not restart after updating over itself" }
          Stop-Process -Name Notchman -Force -ErrorAction SilentlyContinue
      - run: Get-Item dist/Notchman-Setup.exe | Select-Object Name, @{n='MB';e={[math]::Round($_.Length/1MB,1)}}
        shell: pwsh
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1
      # The installer goes to the release job through the downloads bucket
      # (builds/<run>/, removed after publishing), not GitHub's small artifact storage.
      - name: Hand the installer to the release job
        shell: bash
        run: |
          BUCKET=$(aws cloudformation describe-stacks --stack-name notchman-downloads --query "Stacks[0].Outputs[?OutputKey=='BucketName'].OutputValue" --output text)
          aws s3 cp dist/Notchman-Setup.exe "s3://$BUCKET/builds/${{ github.run_number }}/Notchman-Setup.exe" --only-show-errors

  # Real mouse clicks on the floating windows (the pill's X, the Shiba), on
  # Windows. Separate from the build so it never holds up a release.
  clicks:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Download Electron (retried; GitHub's download server sometimes times out)
        run: |
          for ($i = 1; $i -le 4; $i++) {
            npx install-electron --no
            if (Test-Path node_modules/electron/path.txt) { break }
            Start-Sleep -Seconds (10 * $i)
          }
          npx electron --version
      - name: Click the pill's X and the Shiba with the real mouse
        timeout-minutes: 5
        run: |
          npx electron test/e2e/clicks.js "$PWD\clicks.txt"
          $code = $LASTEXITCODE
          Get-Content clicks.txt
          # 2: this machine doesn't deliver simulated clicks at all, so there's nothing to judge.
          if ($code -eq 2) { Write-Host "::warning::Simulated clicks don't reach windows on this runner; click test skipped"; exit 0 }
          exit $code

  mac:
    runs-on: macos-15
    timeout-minutes: 75
    outputs:
      signed: ${{ steps.signing.outputs.signed }}
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - name: Built-in text recognition (Vision)
        run: node scripts/ocr-smoke.js
        continue-on-error: true
      - name: Free on-computer voice (Kokoro)
        run: npx electron scripts/kokoro-smoke.js
        continue-on-error: true
        timeout-minutes: 8
      # A TL;DR reads the icon of the app in front; on some macOS versions
      # Electron's way of doing it crashed the app, so the Mac uses its own tools.
      - name: The app-in-front icon, the Mac way
        run: npx electron scripts/front-app-smoke.js
        timeout-minutes: 3
      - name: Does Electron's own icon reader crash on this Mac? (information only)
        run: npx electron scripts/front-app-smoke.js --old
        continue-on-error: true
        timeout-minutes: 3
      - name: Press TL;DR in the real app (fake server) and screenshot the pill
        run: npx electron test/e2e/harness.js
        continue-on-error: true
        timeout-minutes: 6
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mac-pill-screenshots
          path: desktop/test/e2e/out
          if-no-files-found: ignore
          retention-days: 7
      - name: Version from the build number (shown in the tray menu)
        run: npm pkg set version=0.1.${{ github.run_number }}
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1
      # Developer ID signing and Apple notarization, so the app opens without a
      # warning: the certificate is desktop/build/*.cer, its key is in Parameter
      # Store (see mac-signing.yml). Without them the app is only ad-hoc signed
      # and macOS asks people to allow it in Privacy & Security.
      - name: Apple signing
        id: signing
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          set -euo pipefail
          umask 077
          mac() { node -e 'const fs = require("fs"); const p = JSON.parse(fs.readFileSync("package.json")); Object.assign(p.build.mac, JSON.parse(process.argv[1])); if (process.argv[2]) p.build.dmg = { ...p.build.dmg, ...JSON.parse(process.argv[2]) }; fs.writeFileSync("package.json", JSON.stringify(p, null, 2))' "$@"; }
          CER=$(ls build/*.cer 2>/dev/null | head -1 || true)
          KEY="$RUNNER_TEMP/key.pem"
          if [ -z "$CER" ] || [ -z "$ASC_KEY_P8" ] || ! aws ssm get-parameter --name /notchman/MAC_SIGNING_KEY --with-decryption --query Parameter.Value --output text > "$KEY" 2>/dev/null; then
            echo "::warning::The Mac app isn't notarized: no Developer ID certificate yet (Actions → Mac signing). macOS asks people to allow it."
            mac '{"identity": "-", "hardenedRuntime": false, "entitlements": null, "entitlementsInherit": null}'
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          openssl x509 -inform der -in "$CER" -out "$RUNNER_TEMP/cert.pem"
          openssl x509 -in "$RUNNER_TEMP/cert.pem" -noout -subject -enddate
          curl -sSfL https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer | openssl x509 -inform der -out "$RUNNER_TEMP/ca.pem"
          PASS=$(openssl rand -hex 16)
          echo "::add-mask::$PASS"
          /usr/bin/openssl pkcs12 -export -inkey "$KEY" -in "$RUNNER_TEMP/cert.pem" -certfile "$RUNNER_TEMP/ca.pem" \
            -name "Notchman Developer ID" -out "$RUNNER_TEMP/signing.p12" -passout "pass:$PASS"
          rm -f "$KEY"
          printf '%s\n' "$ASC_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
          {
            echo "CSC_LINK=$RUNNER_TEMP/signing.p12"
            echo "CSC_KEY_PASSWORD=$PASS"
            echo "APPLE_API_KEY=$RUNNER_TEMP/AuthKey.p8"
            echo "APPLE_API_KEY_ID=$ASC_KEY_ID"
            echo "APPLE_API_ISSUER=$ASC_ISSUER_ID"
          } >> "$GITHUB_ENV"
          mac '{"notarize": true}' '{"sign": true}'
          echo "signed=true" >> "$GITHUB_OUTPUT"
      - run: npm run dist:mac
      - name: Self-test the built app (screen reading and voice)
        timeout-minutes: 6
        run: |
          dist/mac-arm64/Notchman.app/Contents/MacOS/Notchman --self-test="$PWD/test/fixtures/screen-text.png" --self-test-out="$PWD/self-test.txt" || true
          cat self-test.txt
          grep -q 'Tesseract OCR: ok' self-test.txt
          grep -q 'built-in OCR: ok' self-test.txt
          grep -q 'update check: ok' self-test.txt
      - name: Name the Mac downloads (Apple silicon is the default)
        run: |
          mv dist/Notchman-arm64.dmg dist/Notchman.dmg
          mv dist/Notchman-x64.dmg dist/Notchman-Intel.dmg
          ls -lh dist/*.dmg
      - name: Notarize the disk images, and check a Mac would open the app
        if: steps.signing.outputs.signed == 'true'
        run: |
          for f in dist/Notchman.dmg dist/Notchman-Intel.dmg; do
            xcrun notarytool submit "$f" --key "$APPLE_API_KEY" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER" --wait --timeout 30m
            xcrun stapler staple "$f"
          done
          for app in dist/mac-arm64/Notchman.app dist/mac/Notchman.app; do
            codesign --verify --deep --strict "$app"
            xcrun stapler validate "$app"
            spctl --assess --type execute -vv "$app"
          done
          spctl --assess --type open --context context:primary-signature -vv dist/Notchman.dmg
      - name: Hand the installers to the release job
        run: |
          BUCKET=$(aws cloudformation describe-stacks --stack-name notchman-downloads --query "Stacks[0].Outputs[?OutputKey=='BucketName'].OutputValue" --output text)
          for f in Notchman.dmg Notchman-Intel.dmg; do
            aws s3 cp "dist/$f" "s3://$BUCKET/builds/${{ github.run_number }}/$f" --only-show-errors
          done

  release:
    needs: [windows, mac, clicks]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1
      - name: Get the installers from the build jobs
        run: |
          BUCKET=$(aws cloudformation describe-stacks --stack-name notchman-downloads --query "Stacks[0].Outputs[?OutputKey=='BucketName'].OutputValue" --output text)
          echo "BUCKET=$BUCKET" >> "$GITHUB_ENV"
          mkdir -p out/Notchman-Windows out/Notchman-Mac
          aws s3 cp "s3://$BUCKET/builds/${{ github.run_number }}/Notchman-Setup.exe" out/Notchman-Windows/ --only-show-errors
          aws s3 cp "s3://$BUCKET/builds/${{ github.run_number }}/Notchman.dmg" out/Notchman-Mac/ --only-show-errors
          aws s3 cp "s3://$BUCKET/builds/${{ github.run_number }}/Notchman-Intel.dmg" out/Notchman-Mac/ --only-show-errors
          ls -lh out/*/
      - name: Publish the installers as the latest release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MAC_NOTE: ${{ needs.mac.outputs.signed != 'true' && ' The first time, if macOS says it could not verify Notchman, open System Settings → Privacy & Security and click Open Anyway.' || '' }}
        run: |
          gh release create "desktop-${{ github.run_number }}" \
            out/Notchman-Windows/Notchman-Setup.exe out/Notchman-Mac/Notchman.dmg out/Notchman-Mac/Notchman-Intel.dmg \
            --repo "${{ github.repository }}" --target "${{ github.sha }}" --latest \
            --title "Notchman for Windows and Mac (build ${{ github.run_number }})" \
            --notes "Windows: run Notchman-Setup.exe (if Windows warns, choose More info → Run anyway). Mac: open Notchman.dmg (Apple silicon) or Notchman-Intel.dmg (Intel Macs) and drag Notchman to Applications.$MAC_NOTE"
      - uses: actions/checkout@v4
        with:
          path: repo
          sparse-checkout: deploy/downloads
      - name: Publish to the downloads site (what the website and in-app updates use)
        run: |
          mkdir -p public
          cp out/Notchman-Windows/Notchman-Setup.exe out/Notchman-Mac/Notchman.dmg out/Notchman-Mac/Notchman-Intel.dmg public/
          repo/deploy/downloads/publish-downloads.sh "${{ github.run_number }}" public | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Clear the hand-over folder (this build and older unreleased ones)
        if: always()
        run: |
          for n in $(aws s3 ls "s3://$BUCKET/builds/" | awk '/PRE/ {print $2}' | tr -d /); do
            if [ "$n" -le "${{ github.run_number }}" ]; then aws s3 rm "s3://$BUCKET/builds/$n/" --recursive --only-show-errors; fi
          done
