name: Desktop

# Builds the Windows installer (Notchman-Setup.exe) and the Mac app
# (Notchman.dmg) on GitHub's machines and publishes them as a GitHub Release,
# so these links always serve the newest build (for the website's buttons):
#   https://github.com/Iamritupatil/notchman/releases/latest/download/Notchman-Setup.exe
#   https://github.com/Iamritupatil/notchman/releases/latest/download/Notchman.dmg
# Runs by hand, and on pushes that change the desktop app. Needs the repository
# to be public for anyone to download.
on:
  workflow_dispatch:
  push:
    paths:
      - "desktop/**"
      - ".github/workflows/desktop.yml"

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: Notchman-Windows
          path: desktop/dist/Notchman-Setup.exe
          if-no-files-found: error

  mac:
    runs-on: macos-15
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run dist:mac
      - uses: actions/upload-artifact@v4
        with:
          name: Notchman-Mac
          path: desktop/dist/Notchman.dmg
          if-no-files-found: error

  release:
    needs: [windows, mac]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
      - name: Publish the installers as the latest release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "desktop-${{ github.run_number }}" \
            out/Notchman-Windows/Notchman-Setup.exe out/Notchman-Mac/Notchman.dmg \
            --repo "${{ github.repository }}" --target "${{ github.sha }}" --latest \
            --title "Notchman for Windows and Mac (build ${{ github.run_number }})" \
            --notes "Windows: run Notchman-Setup.exe (if Windows warns, choose More info → Run anyway). Mac: open Notchman.dmg and drag Notchman to Applications (the first time, right-click Notchman → Open)."
