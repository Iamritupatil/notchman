name: Mac signing

# Lets Notchman for Mac open like any other app, with no "Apple could not
# verify" warning: an Apple Developer ID certificate signs it and Apple
# notarizes it (desktop.yml does both once the certificate is here).
# Run it from Actions → Mac signing → Run workflow.
#
#   check        what a Mac does with today's download (Gatekeeper's verdict)
#   certificate  only the Apple Account Holder can create a Developer ID
#                certificate (not the API key), so this makes the private key,
#                keeps it in AWS Parameter Store (/notchman/MAC_SIGNING_KEY,
#                SecureString) and commits its certificate request:
#                  desktop/build/developer-id.certSigningRequest
#                Upload that at developer.apple.com (Developer ID Application,
#                G2 Sub-CA), then put the downloaded .cer file in desktop/build/.
on:
  workflow_dispatch:

jobs:
  check:
    runs-on: macos-15
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1
      - name: What a Mac does with today's download
        run: |
          BUCKET=$(aws cloudformation describe-stacks --stack-name notchman-downloads --query "Stacks[0].Outputs[?OutputKey=='BucketName'].OutputValue" --output text)
          aws s3 cp "s3://$BUCKET/latest/Notchman.dmg" . --only-show-errors
          # As if downloaded with Chrome: the quarantine flag is what makes Gatekeeper check it.
          QUARANTINE="0081;$(printf '%x' "$(date +%s)");Chrome;$(uuidgen)"
          xattr -w com.apple.quarantine "$QUARANTINE" Notchman.dmg
          MOUNT=$(hdiutil attach -nobrowse -readonly Notchman.dmg | awk -F'\t' '/\/Volumes\//{print $NF}')
          mkdir -p Applications
          ditto "$MOUNT/Notchman.app" Applications/Notchman.app
          xattr -w com.apple.quarantine "$QUARANTINE" Applications/Notchman.app
          hdiutil detach "$MOUNT" -quiet
          {
            echo '### Gatekeeper on macOS 15, for the Notchman.dmg people download now'
            echo '```'
            echo "Gatekeeper: $(spctl --status)"
            echo; echo '$ codesign -dv (who signed it)'
            codesign -dv Applications/Notchman.app 2>&1 || true
            echo; echo '$ codesign --verify --deep --strict (is the signature intact?)'
            codesign --verify --deep --strict --verbose=2 Applications/Notchman.app 2>&1 && echo "signature intact" || true
            echo; echo '$ spctl --assess (would it open?)'
            spctl --assess --type execute -vv Applications/Notchman.app 2>&1 || true
            echo; echo '$ syspolicy_check distribution'
            syspolicy_check distribution Applications/Notchman.app 2>&1 | head -40 || true
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

  certificate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1
      - name: Signing key and certificate
        run: |
          set -euo pipefail
          umask 077
          say() { echo "$*" | tee -a "$GITHUB_STEP_SUMMARY"; }
          KEY="$RUNNER_TEMP/key.pem"
          if aws ssm get-parameter --name /notchman/MAC_SIGNING_KEY --with-decryption --query Parameter.Value --output text > "$KEY" 2>/dev/null; then
            echo "Using the signing key in Parameter Store."
          else
            openssl genrsa -out "$KEY" 2048 2>/dev/null
            aws ssm put-parameter --name /notchman/MAC_SIGNING_KEY --type SecureString --value "file://$KEY" >/dev/null
            echo "Made a new signing key and saved it to Parameter Store."
          fi
          CER=$(ls desktop/build/*.cer 2>/dev/null | head -1 || true)
          if [ -n "$CER" ]; then
            if [ "$(openssl x509 -inform der -in "$CER" -noout -pubkey | openssl sha256)" = "$(openssl pkey -in "$KEY" -pubout | openssl sha256)" ]; then
              say "Ready: $CER matches the signing key. Desktop builds are signed and notarized."
              openssl x509 -inform der -in "$CER" -noout -subject -enddate | tee -a "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            say "$CER doesn't match the signing key in Parameter Store. Make a new certificate from desktop/build/developer-id.certSigningRequest."
          fi
          # The request is public: it only carries the key's public half.
          openssl req -new -key "$KEY" -subj "/CN=Notchman Developer ID" -out desktop/build/developer-id.certSigningRequest
          rm -f "$KEY"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add desktop/build/developer-id.certSigningRequest
          git commit -q -m "Mac signing: certificate request for the Developer ID certificate [skip ci]" && git push -q || echo "The certificate request is already in the repository."
          say "Next (Account Holder, about 2 minutes):"
          say "1. Download https://github.com/${{ github.repository }}/raw/${{ github.ref_name }}/desktop/build/developer-id.certSigningRequest"
          say "2. developer.apple.com/account/resources/certificates/add → Developer ID Application → G2 Sub-CA → upload that file → Download."
          say "3. https://github.com/${{ github.repository }}/upload/${{ github.ref_name }}/desktop/build → drop the downloaded .cer file → Commit changes."
