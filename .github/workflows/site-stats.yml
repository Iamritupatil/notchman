name: Site stats

# notchman.app's visitors, sources, devices, clicks, scroll depth, time on
# page and FAQ opens, downloads, and desktop app installs and opens (cookieless daily counts; see server/src/site-analytics.ts).
# The same report is emailed every Monday.
on:
  workflow_dispatch:
    inputs:
      email:
        description: Also email the report now
        type: boolean
        default: false
      dashboard_token:
        description: Email me the dashboard password (the owner email only; never shown here)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1
      - name: Email the dashboard password
        if: ${{ inputs.dashboard_token }}
        run: |
          FN=$(aws cloudformation describe-stack-resources --stack-name notchman \
               --query "StackResources[?ResourceType=='AWS::Lambda::Function'].PhysicalResourceId" --output text)
          aws lambda invoke --function-name "$FN" --cli-binary-format raw-in-base64-out \
            --payload '{"task":"dashboard-token"}' out-token.json >/dev/null
          jq -r '.body' out-token.json | sed -E 's/[0-9a-f]{32}/[hidden]/g' >> "$GITHUB_STEP_SUMMARY"
      - name: Last 7 days
        run: |
          FN=$(aws cloudformation describe-stack-resources --stack-name notchman \
               --query "StackResources[?ResourceType=='AWS::Lambda::Function'].PhysicalResourceId" --output text)
          TASK=${{ inputs.email && 'site-report-email' || 'site-report' }}
          aws lambda invoke --function-name "$FN" --cli-binary-format raw-in-base64-out \
            --payload "{\"task\":\"$TASK\"}" out.json >/dev/null
          jq -r '.body | fromjson | .report' out.json | tee -a "$GITHUB_STEP_SUMMARY"
      # Emails are masked: Actions logs are public whenever the repository is.
      - name: Who downloaded (the email asked before the download, and the installs it led to)
        run: |
          TABLE=$(aws cloudformation describe-stack-resources --stack-name notchman \
                  --query "StackResources[?ResourceType=='AWS::DynamoDB::Table'].PhysicalResourceId" --output text)
          aws dynamodb scan --table-name "$TABLE" --filter-expression "begins_with(pk, :p)" \
            --expression-attribute-values '{":p":{"S":"signup_"}}' --projection-expression "#d" \
            --expression-attribute-names '{"#d":"data"}' --output json |
            jq -r '[(.Items // [])[] | .data.S | fromjson] | sort_by(.lastAt) | reverse
              | if length == 0 then "No emails given before downloading yet." else
                  "\(length) people gave their email before downloading (\([.[] | select((.installs // []) | length > 0)] | length) of them have opened the app):",
                  (.[] | "- \(.lastAt[0:16] | sub("T"; " ")) UTC  \(.email | sub("^(?<a>.).*@"; "\(.a)•••@"))  \(.platform)  from \(.source)  " +
                     (if ((.installs // []) | length) > 0
                      then "installed: " + ([.installs[] | "\(.platform) \(.version) (install \(.install | sub("^install:"; "") | .[0:8])…, computer \((.device // "?")[0:8])…)"] | join(", "))
                      else "not opened yet" end))
                end'
      - name: iPhone accounts (Sign in with Apple, with their plan)
        run: |
          TABLE=$(aws cloudformation describe-stack-resources --stack-name notchman \
                  --query "StackResources[?ResourceType=='AWS::DynamoDB::Table'].PhysicalResourceId" --output text)
          aws dynamodb scan --table-name "$TABLE" --filter-expression "begins_with(pk, :p)" \
            --expression-attribute-values '{":p":{"S":"account_"}}' --projection-expression "#d" \
            --expression-attribute-names '{"#d":"data"}' --output json |
            jq -r '[(.Items // [])[] | .data.S | fromjson | select(.deleted | not)] | sort_by(.lastAt) | reverse
              | if length == 0 then "No iPhone accounts yet." else
                  "\(length) iPhone accounts (\([.[] | select(.plan != "free")] | length) on Pro or Pro+):",
                  (.[] | "- \(.firstAt[0:10])  \(.email // "no email shared" | sub("^(?<a>.).*@"; "\(.a)•••@"))\(if .privateEmail then " (Hide My Email)" else "" end)  \(.name // "")  plan \(.plan)\(if .subscription then " (subscription \(.subscription))" else "" end)  Apple ID \(.appleUserId)  installs \((.installs // []) | length)")
                end' | tee -a "$GITHUB_STEP_SUMMARY"
      - name: The tracker and the download links answer
        run: |
          # HEAD requests aren't counted as downloads.
          for p in mac mac-intel windows; do
            echo "== notchman.app/download/$p"
            curl -sSIL -A notchman-check-bot "https://notchman.app/download/$p" | grep -iE '^(HTTP|location|content-length|content-type)'
          done
          curl -sS -o /dev/null -w "POST /event: HTTP %{http_code}\n" -X POST \
            https://x6clb2pbdxbr55i5sdradcnqw40bmqrt.lambda-url.us-east-1.on.aws/event \
            -H 'User-Agent: notchman-check-bot' -d '{"e":"view","p":"/"}'
      - name: Installer downloads per day (CloudFront bytes ÷ installer size)
        run: |
          DIST=$(aws cloudformation describe-stacks --stack-name notchman-downloads \
                 --query "Stacks[0].Outputs[?OutputKey=='DistributionId'].OutputValue" --output text)
          START=$(date -u -d '-7 days' +%Y-%m-%dT00:00:00Z); END=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          {
            echo ""
            echo "Installer downloads (estimate: bytes served ÷ ~120 MB per installer; UTC days)"
            aws cloudwatch get-metric-statistics --namespace AWS/CloudFront --metric-name BytesDownloaded \
              --dimensions Name=DistributionId,Value="$DIST" Name=Region,Value=Global \
              --start-time "$START" --end-time "$END" --period 86400 --statistics Sum --output json |
              jq -r '.Datapoints | sort_by(.Timestamp)[] | "  \(.Timestamp[0:10])  ~\((.Sum / 120000000) | floor) downloads  (\((.Sum / 1000000) | floor) MB)"'
            echo ""
            echo "Requests per day (all files, including app update checks) and the share that failed (4xx)"
            for m in Requests 4xxErrorRate; do
              stat=$([ "$m" = Requests ] && echo Sum || echo Average)
              aws cloudwatch get-metric-statistics --namespace AWS/CloudFront --metric-name "$m" \
                --dimensions Name=DistributionId,Value="$DIST" Name=Region,Value=Global \
                --start-time "$START" --end-time "$END" --period 86400 --statistics "$stat" --output json |
                jq -r --arg m "$m" --arg s "$stat" '.Datapoints | sort_by(.Timestamp)[] | "  \(.Timestamp[0:10])  \($m) \(.[$s] | . * 10 | floor / 10)"'
            done
            echo ""
            echo "Files on the downloads site"
            BUCKET=$(aws cloudformation describe-stacks --stack-name notchman-downloads \
                     --query "Stacks[0].Outputs[?OutputKey=='BucketName'].OutputValue" --output text)
            aws s3 ls "s3://$BUCKET/latest/" --human-readable
          } | tee -a "$GITHUB_STEP_SUMMARY"
