name: Site stats

# notchman.app's visitors, sources, devices, clicks, scroll depth, time on
# page and FAQ opens, downloads, and desktop app installs and opens (cookieless daily counts; see server/src/site-analytics.ts).
# The same report is emailed every Monday.
on:
  workflow_dispatch:
    inputs:
      email:
        description: Also email the report now
        type: boolean
        default: false

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1
      - name: Last 7 days
        run: |
          FN=$(aws cloudformation describe-stack-resources --stack-name notchman \
               --query "StackResources[?ResourceType=='AWS::Lambda::Function'].PhysicalResourceId" --output text)
          TASK=${{ inputs.email && 'site-report-email' || 'site-report' }}
          aws lambda invoke --function-name "$FN" --cli-binary-format raw-in-base64-out \
            --payload "{\"task\":\"$TASK\"}" out.json >/dev/null
          jq -r '.body | fromjson | .report' out.json | tee -a "$GITHUB_STEP_SUMMARY"
      - name: The tracker and the download links answer
        run: |
          # HEAD requests aren't counted as downloads.
          curl -sSIL https://notchman.app/download/windows | grep -iE '^(HTTP|location|content-length)'
          curl -sS -o /dev/null -w "POST /event: HTTP %{http_code}\n" -X POST \
            https://x6clb2pbdxbr55i5sdradcnqw40bmqrt.lambda-url.us-east-1.on.aws/event \
            -H 'User-Agent: notchman-check-bot' -d '{"e":"view","p":"/"}'
      - name: Installer downloads per day (CloudFront bytes ÷ installer size)
        run: |
          DIST=$(aws cloudformation describe-stacks --stack-name notchman-downloads \
                 --query "Stacks[0].Outputs[?OutputKey=='DistributionId'].OutputValue" --output text)
          START=$(date -u -d '-7 days' +%Y-%m-%dT00:00:00Z); END=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          {
            echo ""
            echo "Installer downloads (estimate: bytes served ÷ ~120 MB per installer; UTC days)"
            aws cloudwatch get-metric-statistics --namespace AWS/CloudFront --metric-name BytesDownloaded \
              --dimensions Name=DistributionId,Value="$DIST" Name=Region,Value=Global \
              --start-time "$START" --end-time "$END" --period 86400 --statistics Sum --output json |
              jq -r '.Datapoints | sort_by(.Timestamp)[] | "  \(.Timestamp[0:10])  ~\((.Sum / 120000000) | floor) downloads  (\((.Sum / 1000000) | floor) MB)"'
          } | tee -a "$GITHUB_STEP_SUMMARY"
