name: Microsoft Store package

# Builds Notchman for Windows as a Microsoft Store package (.appx). Microsoft
# signs Store apps, so Windows trusts them: no "unknown app" or antivirus
# warnings like the website's unsigned installer gets. The Store also keeps it
# updated (the app's own updater is off in the Store version).
#
# The package carries Notchman's identity from Partner Center (Apps and games →
# Notchman → Product identity; Store ID 9PGK888D8BCK). Repository variables
# with the same names override it.
#
# The package is attached to a pre-release named store-<number>; upload it in
# Partner Center → Notchman → Packages.
on:
  workflow_dispatch:

jobs:
  appx:
    runs-on: windows-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: desktop
    env:
      STORE_IDENTITY_NAME: ${{ vars.STORE_IDENTITY_NAME || 'RituPatil.Notchman' }}
      STORE_PUBLISHER: ${{ vars.STORE_PUBLISHER || 'CN=CD0E4238-1CC2-42B0-8C9B-D5A008D6A87A' }}
      STORE_PUBLISHER_NAME: ${{ vars.STORE_PUBLISHER_NAME || 'Ritu Patil' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - name: Version (Store versions only go up)
        run: npm pkg set version=0.2.${{ github.run_number }}
      - name: Build the Store package
        run: |
          $real = $env:STORE_IDENTITY_NAME -and $env:STORE_PUBLISHER -and $env:STORE_PUBLISHER_NAME
          if (-not $real) {
            Write-Host "::warning::STORE_IDENTITY_NAME, STORE_PUBLISHER and STORE_PUBLISHER_NAME aren't set: making a test package that can't be uploaded."
            $env:STORE_IDENTITY_NAME = "Notchman.Test"
            $env:STORE_PUBLISHER = "CN=Notchman Test"
            $env:STORE_PUBLISHER_NAME = "Notchman Test"
            "STORE_IDENTITY_NAME=$env:STORE_IDENTITY_NAME", "STORE_PUBLISHER=$env:STORE_PUBLISHER" | Out-File -FilePath $env:GITHUB_ENV -Append
          }
          npx electron-builder --win appx --publish never `
            "-c.appx.identityName=$env:STORE_IDENTITY_NAME" `
            "-c.appx.publisher=$env:STORE_PUBLISHER" `
            "-c.appx.publisherDisplayName=$env:STORE_PUBLISHER_NAME"
          Get-ChildItem dist/*.appx | Select-Object Name, @{n='MB';e={[math]::Round($_.Length/1MB,1)}}
          "REAL=$real" | Out-File -FilePath $env:GITHUB_ENV -Append
      # Installs the package on this clean Windows machine and runs the app's
      # self-test inside it, as the Store will run it: a packaged app lives in a
      # container, where paths, the voice model and screen reading can behave
      # differently. Partner Center gets the unsigned package; this test signs a
      # copy with a throwaway certificate, because Windows only installs signed ones.
      - name: Install the package and run the app inside it
        timeout-minutes: 10
        run: |
          $ErrorActionPreference = 'Stop'
          $cert = New-SelfSignedCertificate -Type Custom -Subject $env:STORE_PUBLISHER -KeyUsage DigitalSignature -FriendlyName 'Notchman package test' `
            -CertStoreLocation 'Cert:\CurrentUser\My' -TextExtension @('2.5.29.37={text}1.3.6.1.5.5.7.3.3', '2.5.29.19={text}')
          $password = [guid]::NewGuid().ToString()
          Export-PfxCertificate -Cert $cert -FilePath "$env:RUNNER_TEMP\test.pfx" -Password (ConvertTo-SecureString $password -Force -AsPlainText) | Out-Null
          Export-Certificate -Cert $cert -FilePath "$env:RUNNER_TEMP\test.cer" | Out-Null
          Import-Certificate -FilePath "$env:RUNNER_TEMP\test.cer" -CertStoreLocation 'Cert:\LocalMachine\TrustedPeople' | Out-Null
          Copy-Item dist/Notchman-Store.appx "$env:RUNNER_TEMP\test.appx"
          $signtool = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe' | Sort-Object FullName | Select-Object -Last 1
          & $signtool.FullName sign /fd SHA256 /f "$env:RUNNER_TEMP\test.pfx" /p $password "$env:RUNNER_TEMP\test.appx"
          if ($LASTEXITCODE) { throw 'signing the test copy failed' }
          Add-AppxPackage -Path "$env:RUNNER_TEMP\test.appx"
          $package = Get-AppxPackage | Where-Object { $_.Name -eq $env:STORE_IDENTITY_NAME }
          if (-not $package) { throw 'the package did not install' }
          "Installed $($package.PackageFullName)"
          $exe = Get-ChildItem $package.InstallLocation -Recurse -Filter Notchman.exe | Select-Object -First 1
          $appId = (Get-AppxPackageManifest $package).Package.Applications.Application.Id
          $out = "$env:RUNNER_TEMP\self-test.txt"
          Invoke-CommandInDesktopPackage -PackageFamilyName $package.PackageFamilyName -AppId $appId -Command $exe.FullName `
            -Args "--self-test=`"$PWD\test\fixtures\screen-text.png`" --self-test-out=`"$out`""
          $deadline = (Get-Date).AddMinutes(6)
          while ((Get-Date) -lt $deadline -and -not ((Test-Path $out) -and (Select-String -Path $out -Pattern '^done$' -Quiet))) { Start-Sleep -Seconds 3 }
          if (-not (Test-Path $out)) { throw 'the packaged app never wrote its self-test' }
          Get-Content $out
          Get-Content $out | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          foreach ($check in 'Microsoft Store package', 'built-in OCR: ok', 'Tesseract OCR: ok', 'Kokoro voice: ok', '^done$') {
            if (-not (Select-String -Path $out -Pattern $check -Quiet)) { throw "packaged app check failed: $check" }
          }
      # The Notchman window, opened as a user would: each tab's data loads.
      - name: Open the Notchman window in the Store package
        timeout-minutes: 5
        run: |
          $ErrorActionPreference = 'Stop'
          $package = Get-AppxPackage | Where-Object { $_.Name -eq $env:STORE_IDENTITY_NAME }
          $exe = Get-ChildItem $package.InstallLocation -Recurse -Filter Notchman.exe | Select-Object -First 1
          $appId = (Get-AppxPackageManifest $package).Package.Applications.Application.Id
          $out = "$env:RUNNER_TEMP\ui-store.txt"
          Invoke-CommandInDesktopPackage -PackageFamilyName $package.PackageFamilyName -AppId $appId -Command $exe.FullName -Args "--ui-test-out=`"$out`""
          $deadline = (Get-Date).AddMinutes(3)
          while ((Get-Date) -lt $deadline -and -not ((Test-Path $out) -and (Select-String -Path $out -Pattern '^done$' -Quiet))) { Start-Sleep -Seconds 3 }
          Get-Content $out
          Get-Content $out | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          if (Select-String -Path $out -Pattern 'FAILED|error|gone' -Quiet) { throw 'the Notchman window did not load' }
      # Many people had the website version (it starts with Windows) before the
      # Store one: both installed and running at once must still work.
      - name: With the website version installed and running too
        timeout-minutes: 8
        run: |
          $ErrorActionPreference = 'Stop'
          Invoke-WebRequest https://dy7adwloxsruv.cloudfront.net/latest/Notchman-Setup.exe -OutFile "$env:RUNNER_TEMP\setup.exe"
          Start-Process "$env:RUNNER_TEMP\setup.exe" -ArgumentList '/S' -Wait
          $site = "$env:LOCALAPPDATA\Programs\Notchman\Notchman.exe"
          Start-Process $site
          Start-Sleep -Seconds 15
          "Running: $((Get-Process Notchman -ErrorAction SilentlyContinue | Measure-Object).Count) Notchman processes"
          $package = Get-AppxPackage | Where-Object { $_.Name -eq $env:STORE_IDENTITY_NAME }
          $exe = Get-ChildItem $package.InstallLocation -Recurse -Filter Notchman.exe | Select-Object -First 1
          $appId = (Get-AppxPackageManifest $package).Package.Applications.Application.Id
          $out = "$env:RUNNER_TEMP\ui-both.txt"
          Invoke-CommandInDesktopPackage -PackageFamilyName $package.PackageFamilyName -AppId $appId -Command $exe.FullName -Args "--ui-test-out=`"$out`""
          Start-Sleep -Seconds 30
          if (Test-Path $out) { Get-Content $out } else { 'The Store app wrote nothing: it handed over to the running website version.' }
          # The website version's own window, as a second start opens it.
          $out2 = "$env:RUNNER_TEMP\ui-site.txt"
          Get-Process Notchman -ErrorAction SilentlyContinue | Stop-Process -Force
          Start-Sleep -Seconds 3
          Start-Process $site -ArgumentList "--ui-test-out=`"$out2`""
          Start-Sleep -Seconds 30
          if (Test-Path $out2) { Get-Content $out2 } else { 'The website version wrote nothing.' }
      - name: Attach it to a pre-release (for Partner Center)
        if: env.REAL == 'True'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "store-${{ github.run_number }}" dist/Notchman-Store.appx `
            --repo "${{ github.repository }}" --target "${{ github.sha }}" --prerelease `
            --title "Notchman for the Microsoft Store (build ${{ github.run_number }})" `
            --notes "Upload Notchman-Store.appx in Partner Center → Notchman → Packages."
