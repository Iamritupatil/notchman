name: Screenshots

# Run manually (Actions → Screenshots → Run workflow). Builds the app, captures
# each screen in the simulator via the DEBUG -demoScreen launch argument, and
# commits the PNGs to docs/screenshots on the same branch.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  capture:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Generate project
        run: brew install xcodegen && xcodegen generate

      - name: Pick iPhone simulators (a smaller Dynamic Island iPhone and a Pro Max)
        id: sim
        run: |
          xcrun simctl list devices available -j | python3 -c '
          import json, re, sys
          devices = json.load(sys.stdin)["devices"]
          for runtime in sorted(devices, reverse=True):
              if "iOS" not in runtime:
                  continue
              names = {d["name"]: d["udid"] for d in devices[runtime]}
              small = next((u for n, u in sorted(names.items()) if re.fullmatch(r"iPhone \d+", n)), None) \
                  or next((u for n, u in sorted(names.items()) if re.fullmatch(r"iPhone \d+ Pro", n)), None)
              large = next((u for n, u in sorted(names.items()) if re.fullmatch(r"iPhone \d+ Pro Max", n)), None)
              if small and large:
                  print(f"small={small}"); print(f"large={large}"); sys.exit(0)
          sys.exit("No suitable iPhone simulators found")
          ' >> "$GITHUB_OUTPUT"

      - name: Build
        run: |
          set -o pipefail
          xcodebuild build -project Notchman.xcodeproj -scheme Notchman \
            -destination "id=${{ steps.sim.outputs.large }}" -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO -quiet

      - name: Capture
        run: |
          capture() {
            UDID="$1"; DIR="$2"
            xcrun simctl boot "$UDID" 2>/dev/null || true
            xcrun simctl bootstatus "$UDID" -b
            xcrun simctl ui "$UDID" appearance light
            xcrun simctl status_bar "$UDID" override --time "9:41" --batteryLevel 100 --cellularBars 4 || true
            xcrun simctl install "$UDID" build/Build/Products/Debug-iphonesimulator/Notchman.app
            mkdir -p "$DIR"
            for screen in onboarding home history settings player fullread generating account signIn paywall; do
              xcrun simctl terminate "$UDID" app.notchman 2>/dev/null || true
              xcrun simctl launch "$UDID" app.notchman -demoScreen "$screen"
              sleep 7
              xcrun simctl io "$UDID" screenshot "$DIR/$screen.png"
            done
            xcrun simctl shutdown "$UDID" || true
          }
          capture "${{ steps.sim.outputs.large }}" docs/screenshots
          capture "${{ steps.sim.outputs.small }}" docs/screenshots/small

      - name: Commit screenshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots
          git commit -m "Update simulator screenshots [skip ci]" || exit 0
          # Other commits may have landed while capturing.
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push
