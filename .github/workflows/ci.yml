name: CI

on:
  push:
  pull_request:

jobs:
  extension-js:
    name: Extension JavaScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm test

  ios:
    name: iOS build & unit tests
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Pick an iPhone simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          for runtime in sorted(devices, reverse=True):
              if "iOS" not in runtime:
                  continue
              for device in devices[runtime]:
                  if device["name"].startswith("iPhone"):
                      print(device["udid"]); sys.exit(0)
          sys.exit("No iPhone simulator found")
          ')
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: Build and test
        run: |
          set -o pipefail
          xcodebuild test \
            -project Notchman.xcodeproj \
            -scheme Notchman \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            | tee xcodebuild.log | grep -E "error:|warning: .*Notchman|Test Case .* (passed|failed)|Executed|\*\* (BUILD|TEST)" || true
          grep -q "\*\* TEST SUCCEEDED \*\*" xcodebuild.log

      - name: Capture screenshots
        run: |
          UDID="${{ steps.sim.outputs.udid }}"
          APP=$(find ~/Library/Developer/Xcode/DerivedData -path "*Debug-iphonesimulator/Notchman.app" -maxdepth 6 | head -1)
          xcrun simctl boot "$UDID" 2>/dev/null || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl ui "$UDID" appearance dark
          xcrun simctl status_bar "$UDID" override --time "9:41" --batteryLevel 100 --cellularBars 4 || true
          xcrun simctl install "$UDID" "$APP"
          mkdir -p screenshots
          for screen in onboarding home history player account signIn paywall; do
            xcrun simctl terminate "$UDID" com.notchman.app 2>/dev/null || true
            xcrun simctl launch "$UDID" com.notchman.app -demoScreen "$screen"
            sleep 6
            xcrun simctl io "$UDID" screenshot "screenshots/$screen.png"
          done

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: screenshots

      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: |
            xcodebuild.log
            TestResults.xcresult
