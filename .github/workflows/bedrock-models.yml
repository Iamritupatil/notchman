name: Bedrock models

# Which text models this AWS account can call in Amazon Bedrock (us-east-1 and
# us-west-2): sends each a two-word test and shows the answer time, or why it
# was refused. By hand only; each test costs a fraction of a cent.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1
      - name: Try each text model
        shell: bash
        run: |
          set +e
          aws sts get-caller-identity --query Arn --output text | sed -E 's/[0-9]{12}/<account>/'
          # Well-known text models, in case listing isn't allowed for this user.
          KNOWN="openai.gpt-oss-120b-1:0 openai.gpt-oss-20b-1:0 us.amazon.nova-pro-v1:0 us.amazon.nova-lite-v1:0 us.amazon.nova-premier-v1:0
                 us.amazon.nova-2-lite-v1:0 us.meta.llama4-maverick-17b-instruct-v1:0 us.meta.llama3-3-70b-instruct-v1:0
                 mistral.mistral-large-2407-v1:0 us.deepseek.r1-v1:0 deepseek.v3-v1:0 qwen.qwen3-32b-v1:0 qwen.qwen3-235b-a22b-2507-v1:0
                 moonshot.kimi-k2-thinking us.anthropic.claude-haiku-4-5-20251001-v1:0"
          for REGION in us-east-1 us-west-2; do
            echo "== $REGION" | tee -a "$GITHUB_STEP_SUMMARY"
            LISTED=$(aws bedrock list-foundation-models --region $REGION --by-output-modality TEXT \
                       --query "modelSummaries[?contains(inferenceTypesSupported, 'ON_DEMAND') && modelLifecycle.status=='ACTIVE'].modelId" --output text 2>&1)
            if [ $? -ne 0 ]; then echo "(listing not allowed: $(echo "$LISTED" | tail -1 | cut -c1-120))"; LISTED=""; fi
            PROFILES=$(aws bedrock list-inference-profiles --region $REGION --query "inferenceProfileSummaries[].inferenceProfileId" --output text 2>/dev/null)
            MODELS=$(echo "$KNOWN $LISTED $PROFILES" | tr '\t ' '\n\n' | grep -Ei 'gpt-oss|nova|llama|mistral|deepseek|qwen|kimi|minimax|glm|gemma|claude' | sort -u)
            for M in $MODELS; do
              START=$(date +%s%N)
              OUT=$(aws bedrock-runtime converse --region $REGION --model-id "$M" \
                      --messages '[{"role":"user","content":[{"text":"Reply with exactly: ok"}]}]' \
                      --inference-config maxTokens=200 --output json 2>&1)
              MS=$(( ($(date +%s%N) - START) / 1000000 ))
              if echo "$OUT" | grep -q '"stopReason"'; then
                echo "OK    ${MS}ms  $M" | tee -a "$GITHUB_STEP_SUMMARY"
              else
                echo "no    $M  $(echo "$OUT" | tr '\n' ' ' | sed -E 's/.*\): //' | cut -c1-110)" | tee -a "$GITHUB_STEP_SUMMARY"
              fi
            done
          done
